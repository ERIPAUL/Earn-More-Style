openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: paystack
    description: Paystack training enrolment payments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /paystack/quote:
    get:
      operationId: getTrainingPaymentQuote
      tags: [paystack]
      summary: Get a short-lived Level 1 training price quote
      description: Returns a server-signed NGN checkout quote using a current USD to NGN rate.
      responses:
        "200":
          description: Current signed training price quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingPaymentQuote"
        "503":
          description: A current foreign exchange quote is unavailable
  /paystack/initialize:
    post:
      operationId: initializePaystackTransaction
      tags: [paystack]
      summary: Initialize a Level 1 training payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingEnrollmentInput"
      responses:
        "200":
          description: Transaction initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaystackInitialization"
        "400":
          description: Invalid enrolment details
        "422":
          description: Email domain cannot receive messages
        "500":
          description: Payment service configuration error
        "503":
          description: Email domain validation temporarily unavailable
        "502":
          description: Paystack initialization failed
  /paystack/webhook:
    post:
      operationId: receivePaystackWebhook
      tags: [paystack]
      summary: Receive signed Paystack payment events
      description: Validates Paystack signatures and processes successful Level 1 payments
      responses:
        "200":
          description: Event acknowledged
        "400":
          description: Payment details do not match
        "401":
          description: Invalid Paystack signature
        "500":
          description: Webhook processing failed
  /paystack/verify/{reference}:
    get:
      operationId: verifyPaystackTransaction
      tags: [paystack]
      summary: Verify a Level 1 training payment
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: "^[A-Za-z0-9._=-]+$"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaystackVerification"
        "400":
          description: Invalid payment reference
        "500":
          description: Payment service configuration error
        "502":
          description: Paystack verification failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TrainingEnrollmentInput:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        secondName:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        quoteToken:
          type: string
          minLength: 40
          maxLength: 2000
      required:
        - firstName
        - secondName
        - email
        - quoteToken
    TrainingPaymentQuote:
      type: object
      additionalProperties: false
      properties:
        quoteToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        fxRateNgnPerUsd:
          type: number
          exclusiveMinimum: 0
        courseNgn:
          type: integer
          const: 100000
        usdCourseEquivalentCents:
          type: integer
          minimum: 1
        usdContingencyCents:
          type: integer
          const: 200
        usdTotalCents:
          type: integer
          minimum: 201
        ngnPayableKobo:
          type: integer
          minimum: 1
      required:
        - quoteToken
        - expiresAt
        - fxRateNgnPerUsd
        - courseNgn
        - usdCourseEquivalentCents
        - usdContingencyCents
        - usdTotalCents
        - ngnPayableKobo
    PaystackInitialization:
      type: object
      additionalProperties: false
      properties:
        authorizationUrl:
          type: string
          format: uri
        reference:
          type: string
      required:
        - authorizationUrl
        - reference
    PaystackVerification:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [success, pending, failed]
        reference:
          type: string
        message:
          type: string
        confirmationEmailSent:
          type: boolean
      required:
        - status
        - reference
        - message
        - confirmationEmailSent

